projects:
  - name: __PROJECT_NAME__
    environments:
      - name: __ENVIRONMENT_DISPLAY__
        networking:
          isolation: enabled
        permissions:
          protection: __PROTECTION__
        services:
          - type: web
            name: __WEB_SERVICE_NAME__
            runtime: docker
            plan: "__SERVICE_PLAN__"
            region: __REGION__
            branch: __BRANCH__
            autoDeployTrigger: "off"
            dockerfilePath: ./Dockerfile
            dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /readyz
            preDeployCommand: /bin/sh scripts/render-predeploy.sh
            envVars:
              - key: ENVIRONMENT
                value: production
              - key: DEPLOYMENT_ENVIRONMENT
                value: __ENVIRONMENT_KEY__
              - key: APP_COMPONENT
                value: web
              - key: APP_VERSION
                value: "0.8.4"
              - key: APP_BASE_URL
                fromService:
                  type: web
                  name: __WEB_SERVICE_NAME__
                  envVarKey: RENDER_EXTERNAL_URL
              - key: DATABASE_URL
                fromDatabase:
                  name: __DATABASE_NAME__
                  property: connectionString
              - key: BOOTSTRAP_ADMIN_USERNAME
                value: Admin
              - key: BOOTSTRAP_ADMIN_PASSWORD
                sync: false
              - key: BOOTSTRAP_ADMIN_EMAIL
                sync: false
              - key: STORAGE_MODE
                value: s3
              - key: S3_ENDPOINT
                sync: false
              - key: S3_REGION
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_PROJECT_ID
                sync: false
              - key: OPENAI_MODEL
                value: gpt-5-mini
              - key: AI_ENABLED
                sync: false
              - key: AI_CONFIDENTIAL_CONTENT_ENABLED
                sync: false
              - key: OPENAI_DATA_CONTROL_MODE
                sync: false
              - key: LIBREOFFICE_PATH
                value: /usr/bin/libreoffice
              - key: DEFAULT_RETENTION_DAYS
                value: "1095"
              - key: MERGE_SOURCE_RECOVERY_DAYS
                value: "30"
              - key: RETENTION_WARNING_DAYS
                value: "30"
              - key: MAINTENANCE_INTERVAL_SECONDS
                value: "3600"

          - type: worker
            name: __WORKER_SERVICE_NAME__
            runtime: docker
            plan: "__SERVICE_PLAN__"
            region: __REGION__
            branch: __BRANCH__
            autoDeployTrigger: "off"
            dockerfilePath: ./Dockerfile
            dockerCommand: python -m app.worker
            envVars:
              - key: ENVIRONMENT
                value: production
              - key: DEPLOYMENT_ENVIRONMENT
                value: __ENVIRONMENT_KEY__
              - key: APP_COMPONENT
                value: worker
              - key: APP_VERSION
                value: "0.8.4"
              - key: DATABASE_URL
                fromDatabase:
                  name: __DATABASE_NAME__
                  property: connectionString
              - key: STORAGE_MODE
                value: s3
              - key: S3_ENDPOINT
                sync: false
              - key: S3_REGION
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_PROJECT_ID
                sync: false
              - key: OPENAI_MODEL
                value: gpt-5-mini
              - key: AI_ENABLED
                sync: false
              - key: AI_CONFIDENTIAL_CONTENT_ENABLED
                sync: false
              - key: OPENAI_DATA_CONTROL_MODE
                sync: false
              - key: LIBREOFFICE_PATH
                value: /usr/bin/libreoffice
              - key: MERGE_SOURCE_RECOVERY_DAYS
                value: "30"
              - key: RETENTION_WARNING_DAYS
                value: "30"
              - key: MAINTENANCE_INTERVAL_SECONDS
                value: "3600"

        databases:
          - name: __DATABASE_NAME__
            databaseName: discovery
            user: discovery_app
            plan: __DATABASE_PLAN__
            region: __REGION__
            postgresMajorVersion: "18"
            diskSizeGB: __DATABASE_DISK_GB__
            ipAllowList: []
