projects:
  - name: cloud-inventory-discovery-staging
    environments:
      - name: Staging
        networking:
          isolation: enabled
        permissions:
          protection: disabled
        services:
          - type: web
            name: cloud-inventory-discovery-staging
            runtime: docker
            plan: "starter"
            region: ohio
            branch: staging
            autoDeployTrigger: "off"
            dockerfilePath: ./Dockerfile
            dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /readyz
            preDeployCommand: /bin/sh scripts/render-predeploy.sh
            envVars:
              - key: ENVIRONMENT
                value: production
              - key: DEPLOYMENT_ENVIRONMENT
                value: staging
              - key: APP_COMPONENT
                value: web
              - key: APP_VERSION
                value: "0.8.3"
              - key: APP_BASE_URL
                fromService:
                  type: web
                  name: cloud-inventory-discovery-staging
                  envVarKey: RENDER_EXTERNAL_URL
              - key: DATABASE_URL
                fromDatabase:
                  name: cloud-inventory-discovery-staging-db
                  property: connectionString
              - key: BOOTSTRAP_ADMIN_USERNAME
                value: Admin
              - key: BOOTSTRAP_ADMIN_PASSWORD
                sync: false
              - key: BOOTSTRAP_ADMIN_EMAIL
                sync: false
              - key: STORAGE_MODE
                value: s3
              - key: S3_ENDPOINT
                sync: false
              - key: S3_REGION
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_PROJECT_ID
                sync: false
              - key: OPENAI_MODEL
                value: gpt-5-mini
              - key: AI_ENABLED
                sync: false
              - key: AI_CONFIDENTIAL_CONTENT_ENABLED
                sync: false
              - key: OPENAI_DATA_CONTROL_MODE
                sync: false
              - key: LIBREOFFICE_PATH
                value: /usr/bin/libreoffice
              - key: DEFAULT_RETENTION_DAYS
                value: "1095"
              - key: MERGE_SOURCE_RECOVERY_DAYS
                value: "30"
              - key: RETENTION_WARNING_DAYS
                value: "30"
              - key: MAINTENANCE_INTERVAL_SECONDS
                value: "3600"

          - type: worker
            name: cloud-inventory-discovery-staging-worker
            runtime: docker
            plan: "starter"
            region: ohio
            branch: staging
            autoDeployTrigger: "off"
            dockerfilePath: ./Dockerfile
            dockerCommand: python -m app.worker
            envVars:
              - key: ENVIRONMENT
                value: production
              - key: DEPLOYMENT_ENVIRONMENT
                value: staging
              - key: APP_COMPONENT
                value: worker
              - key: APP_VERSION
                value: "0.8.3"
              - key: DATABASE_URL
                fromDatabase:
                  name: cloud-inventory-discovery-staging-db
                  property: connectionString
              - key: STORAGE_MODE
                value: s3
              - key: S3_ENDPOINT
                sync: false
              - key: S3_REGION
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_PROJECT_ID
                sync: false
              - key: OPENAI_MODEL
                value: gpt-5-mini
              - key: AI_ENABLED
                sync: false
              - key: AI_CONFIDENTIAL_CONTENT_ENABLED
                sync: false
              - key: OPENAI_DATA_CONTROL_MODE
                sync: false
              - key: LIBREOFFICE_PATH
                value: /usr/bin/libreoffice
              - key: MERGE_SOURCE_RECOVERY_DAYS
                value: "30"
              - key: RETENTION_WARNING_DAYS
                value: "30"
              - key: MAINTENANCE_INTERVAL_SECONDS
                value: "3600"

        databases:
          - name: cloud-inventory-discovery-staging-db
            databaseName: discovery
            user: discovery_app
            plan: basic-256mb
            region: ohio
            postgresMajorVersion: "18"
            diskSizeGB: 5
            ipAllowList: []

